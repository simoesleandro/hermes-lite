<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hermes Lite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app layout-empty" id="app">

    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <span class="brand-icon">⬡</span>
          <span class="brand-name">Hermes <span class="brand-lite">Lite</span></span>
        </div>
        <button id="new-conv-btn" class="new-conv-btn" title="Nova conversa">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          Nova conversa
        </button>
      </div>
      <div class="sidebar-search-wrap">
        <input type="search" id="conv-search" class="conv-search" placeholder="Buscar conversas…" autocomplete="off" />
      </div>
      <div id="sentinela-panel" class="sentinela-panel" hidden></div>
      <div id="tasks-panel" class="tasks-panel" hidden></div>
      <div id="knowledge-panel" class="knowledge-panel" hidden></div>
      <nav class="conv-list" id="conv-list">
        <!-- populated by JS in Stage 4 -->
      </nav>
      <div class="sidebar-status" id="sidebar-status"></div>
    </aside>

    <div class="main" id="main">
      <header class="topbar" id="topbar">
        <button id="hamburger-btn" aria-label="Menu" style="display:none">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="19" y2="6"/>
            <line x1="3" y1="11" x2="19" y2="11"/>
            <line x1="3" y1="16" x2="19" y2="16"/>
          </svg>
        </button>
      </header>

      <main class="chat-area" id="chat-area">
        <div class="chat-inner" id="chat-inner"></div>
      </main>

      <footer class="input-bar" id="input-bar">
        <div class="input-wrap">
          <div class="input-aurora-wrapper">
            <form id="chat-form" class="input-form">
              <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png,.txt" hidden>
              <div class="input-top-row">
                <button type="button" id="attachBtn" title="Anexar arquivo" aria-label="Anexar arquivo">📎</button>
                <textarea
                  id="message-input"
                  placeholder="Como posso ajudar?"
                  autocomplete="off"
                  rows="1"
                ></textarea>
              </div>
              <div class="input-bottom-row">
                <div id="file-chip" hidden>
                  <span id="file-chip-icon"></span>
                  <span id="file-chip-name"></span>
                  <button type="button" id="file-chip-remove">✕</button>
                </div>
                <div id="message-queue" class="message-queue" hidden></div>
                <div class="agent-badge-row">
                  <button class="agent-badge" id="agent-badge" title="Clique para trocar agente">
                    <span id="agent-badge-icon">🧠</span>
                    <span id="agent-badge-label">Conhecimento</span>
                  </button>
                  <button type="button" class="skill-badge" id="skill-badge" hidden title="Skill do agente">
                    <span id="skill-badge-label">Skill</span>
                  </button>
                  <div class="agent-dropdown" id="agent-dropdown" hidden></div>
                  <div class="skill-dropdown" id="skill-dropdown" hidden></div>
                </div>
                <div class="input-actions">
                  <button type="button" id="stop-btn" aria-label="Parar geração">⏹</button>
                  <button type="submit" id="send-btn" aria-label="Enviar">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2.5"
                         stroke-linecap="round" stroke-linejoin="round">
                      <line x1="22" y1="2" x2="11" y2="13"/>
                      <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                    </svg>
                  </button>
                </div>
              </div>
            </form>
          </div>
          <div class="agent-status" id="agent-status" hidden></div>
        </div>
      </footer>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
